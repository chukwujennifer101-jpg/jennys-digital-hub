<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payment status | Jenny's Digital Hub</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080e18;color:#f5f3ee;font:16px/1.7 system-ui,sans-serif}.panel{width:min(520px,calc(100% - 40px));padding:32px;border:1px solid #344253;border-radius:16px;background:#111d2b}h1{margin:0 0 10px;font-size:26px}.muted{color:#aeb9c5}.status{margin:20px 0;padding:15px;border-radius:9px;background:#0b1522}.btn{display:inline-block;padding:11px 16px;border-radius:8px;background:#d0b58d;color:#101722;text-decoration:none;font-weight:700}</style></head><body><main class="panel"><p class="muted">JENNY'S DIGITAL HUB</p><h1>Checking your payment</h1><p id="message" class="status">Please wait while we confirm your payment directly with Paystack.</p><p id="reference" class="muted"></p><a class="btn" href="/">Return to store</a></main><script>
(async()=>{const reference=new URLSearchParams(location.search).get("reference")||new URLSearchParams(location.search).get("trxref");const message=document.getElementById("message");if(!reference){message.textContent="No payment reference was supplied. Please contact the store if you completed a transfer.";return;}document.getElementById("reference").textContent="Order reference: "+reference;try{const response=await fetch("/api/verify?reference="+encodeURIComponent(reference),{cache:"no-store"});const result=await response.json();message.textContent=result.message||result.error||"Payment status could not be confirmed.";message.style.color=result.success?"#8ee0b1":"#f0c48c";}catch{message.textContent="We could not check your payment. Keep your reference and contact the store.";}})();
</script></body></html>
